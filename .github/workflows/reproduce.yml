name: Reproduce Knots release via PR #3 assembler (byte-exact)

# Byte-exact reproduction of a published Knots release from public
# sources only, run through the assemble-deriv PR #3 assembler
# ("Honor --skip-update-check for CHECK-LAST lines") with the
# reproduction harness (synthesize-refs to release-time SHAs,
# auto/per-release overrides). The resulting HEAD is compared
# SHA-for-SHA against the release tag.
#
# This branch differs from ci-reproduce in two ways, both there to
# prove PR #3:
#   - the assemble-knots submodule is checked out at the PR #3 head
#     (pin-submodule.sh; KNOTS_ASSEMBLER_REF, default pull/3/head),
#     NOT the historical per-spec driver pin; and
#   - the CHECK-LAST sed workaround is removed from run-driver.sh, so
#     --skip-update-check is the only thing suppressing CHECK-LAST.
#
# The default release is an OLDER one (v29.3.knots20260210, ~4 months
# of upstream drift) on purpose: it has a CHECK-LAST whose recorded
# last= SHA was orphaned by an upstream rebase, which the old assembler
# dies on even with --skip-update-check. A green run here is the fix
# working end-to-end. Override via the dispatch input or a positional
# arg to run-all.sh locally.
#
# All real work lives in .ci/ scripts; this workflow is thin
# orchestration so the same code paths run locally via
# `./.ci/run-all.sh`.

on:
  push:
    branches: [knots-spec, ci-reproduce, ci-reproduce-pr3]
  schedule:
    - cron: "17 4 * * *"   # 04:17 UTC nightly
  workflow_dispatch:
    inputs:
      knots_tag:
        description: 'Release tag to reproduce (blank = this branch default, v29.3.knots20260210)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: UTC
      GIT_TERMINAL_PROMPT: "0"
      # Assembler to reproduce with. Default = assemble-deriv PR #3 head.
      # Flip to `master` once PR #3 merges (then this branch == ci-reproduce
      # minus the historical pin).
      KNOTS_ASSEMBLER_REF: pull/3/head

    steps:
      - name: Checkout assembly repo (with assemble-knots submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Toolchain check
        run: |
          perl --version | head -1
          git --version
          test -f assemble-knots/assemble-knots.pl
          test -d assemble-knots-resolutions
          test -x .ci/run-all.sh
          test -x extract-remotes.pl

      - name: Reproduce
        run: ./.ci/run-all.sh "${{ inputs.knots_tag || 'v29.3.knots20260210' }}"

      - name: Upload reproduction artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproduce-output
          path: |
            out/
          if-no-files-found: warn
