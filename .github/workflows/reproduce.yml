name: Reproduce Knots release via PRE-FIX assembler (expected RED - bug demo)

# Companion to ci-reproduce-pr3 that demonstrates the BUG assemble-deriv
# PR #3 fixes. Identical to that branch (CHECK-LAST sed removed from
# run-driver.sh, default release v29.3.knots20260210) EXCEPT the
# assemble-knots submodule is pinned to the PRE-FIX assembler -- PR #3's
# parent commit 892ab94 -- instead of the PR #3 head.
#
# EXPECTED RED. 0210 carries a CHECK-LAST whose recorded last= SHA was
# orphaned by an upstream rebase. The pre-fix assembler runs CHECK-LAST
# unconditionally -- it does NOT honor --skip-update-check for CHECK-LAST --
# so it dies trying to resolve that orphaned SHA. The fix (ci-reproduce-pr3)
# skips CHECK-LAST under the flag and goes green. Compare the two runs.
#
# All real work lives in .ci/ scripts; this workflow is thin orchestration
# so the same code paths run locally via `./.ci/run-all.sh`.

on:
  push:
    branches: [ci-reproduce-old-assembler]
  workflow_dispatch:
    inputs:
      knots_tag:
        description: 'Release tag to reproduce (blank = this branch default, v29.3.knots20260210)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: UTC
      GIT_TERMINAL_PROMPT: "0"
      # Assembler to reproduce with. Pinned to the PRE-FIX assembler -- PR #3's
      # parent commit -- to demonstrate the bug (CHECK-LAST ignores
      # --skip-update-check). ci-reproduce-pr3 uses pull/3/head (the fix).
      KNOTS_ASSEMBLER_REF: 892ab94e9ca71d11af07155daf43a398720ce43e

    steps:
      - name: Checkout assembly repo (with assemble-knots submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Toolchain check
        run: |
          perl --version | head -1
          git --version
          test -f assemble-knots/assemble-knots.pl
          test -d assemble-knots-resolutions
          test -x .ci/run-all.sh
          test -x extract-remotes.pl

      - name: Reproduce
        run: ./.ci/run-all.sh "${{ inputs.knots_tag || 'v29.3.knots20260210' }}"

      - name: Upload reproduction artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproduce-output
          path: |
            out/
          if-no-files-found: warn
